name: echo
description: Echo Pro — Your Smart Assistant
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Networking
  dio: ^5.5.0
  dio_smart_retry: ^6.0.0
  connectivity_plus: ^6.0.5
  socket_io_client: ^2.0.3+1

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  flutter_slidable: ^3.1.1
  pull_to_refresh_flutter3: ^2.0.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  logger: ^2.4.0

  # Monitoring
  sentry_flutter: ^8.8.0

  # Platform
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
