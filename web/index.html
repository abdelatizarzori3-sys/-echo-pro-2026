<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Flutter Web</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #1e1e2f, #252540);
      font-family: sans-serif;
      color: white;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    h1 { margin-bottom: 10px; color: #00dfa2; }
    p { color: #chchch; font-size: 1.1em; }
    .status {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 15px;
      background: #00dfa2;
      color: #1e1e2f;
      border-radius: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>تم تفعيل الواجهة الأمامية بنجاح! 🚀</h1>
    <p>مشروع فلاتر الخاص بك مرتبط الآن بخوادم Vercel ويعمل بكفاءة.</p>
    <div class="status">الحالة: متصل وجاهز</div>
  </div>
</body>
</html>
